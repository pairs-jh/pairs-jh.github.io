<!DOCTYPE html>
<html>
<head>
  <title>PAIRS@JH Student Dashboard</title>
</head>
<body>
  <h1>Welcome to PAIRS@JH</h1>
  <div id="student-list"></div>
  <script>
    fetch("https://pairs-backend.onrender.com/api/students")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("student-list");
        data.forEach(student => {
          const div = document.createElement("div");
          div.innerHTML = `<strong>${student.name}</strong> - ${student.level} (${student.tool})`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
